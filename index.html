<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pozwolenie na broń – powtórka pytań</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F1; --card:#FFFFFF; --ink:#1B211D; --muted:#5E675F;
  --line:#D5DAD3; --olive:#3F5B3B; --ok:#2E7A45; --okbg:#E3F1E6;
  --bad:#B3261E; --badbg:#F8E3E1; --ring:#1B211D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131714; --card:#1C221D; --ink:#E7EBE5; --muted:#9BA59C;
    --line:#2F3830; --olive:#9DBB8F; --ok:#6CC488; --okbg:#1D3324;
    --bad:#F08A80; --badbg:#3A1E1C; --ring:#E7EBE5;
  }
}
:root[data-theme="dark"]{
  --paper:#131714; --card:#1C221D; --ink:#E7EBE5; --muted:#9BA59C;
  --line:#2F3830; --olive:#9DBB8F; --ok:#6CC488; --okbg:#1D3324;
  --bad:#F08A80; --badbg:#3A1E1C; --ring:#E7EBE5;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 40px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.target{flex:none;width:56px;height:56px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.65rem;line-height:1.1;margin:0}
.sub{color:var(--muted);font-size:.92rem;margin:2px 0 0}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.modes button,.ctrl{font:inherit;font-weight:600;font-size:.95rem;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--paper)}
.modes button:disabled{opacity:.45;cursor:default}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--olive);width:0;transition:width .25s}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
.topic{color:var(--olive);font-weight:600;font-size:.88rem;margin:0 0 6px}
.qtext{font-weight:600;font-size:1.08rem;margin:0 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);
  background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt b{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem;line-height:1.3;flex:none;width:1.1em}
.opt:hover:not(:disabled){border-color:var(--olive)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.expl{border-left:3px solid var(--olive);padding:4px 0 4px 12px;margin:14px 0 4px;color:var(--ink)}
.expl strong{display:block;margin-bottom:2px}
.next{margin-top:16px;width:100%;font:inherit;font-weight:600;font-size:1rem;border:0;border-radius:10px;
  padding:13px;background:var(--olive);color:var(--paper);cursor:pointer}
.done{text-align:center;padding:28px 18px}
.done .big{font-family:"Barlow Condensed",sans-serif;font-size:3rem;font-weight:700;line-height:1}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:.88rem}
.ctrl{font-size:.85rem;padding:6px 12px}
.sel{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:.95rem;color:var(--muted)}
.sel select{flex:1;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qstat{color:var(--muted);font-size:.82rem;margin:0 0 6px}
.src{display:block;margin-top:6px;color:var(--muted);font-size:.9rem;font-style:italic}
.grade{display:flex;gap:10px;margin-top:16px}
.grade button{flex:1;font:inherit;font-weight:600;font-size:1rem;border-radius:10px;padding:13px;cursor:pointer;border:1.5px solid}
.gok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.gbad{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.fbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.foot{gap:10px;flex-wrap:wrap}
#exportBox{margin-top:14px}
#exportText{width:100%;font:inherit;font-size:.85rem;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px}
select:focus-visible,button:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="target" viewBox="0 0 56 56" aria-hidden="true">
      <circle cx="28" cy="28" r="26" fill="none" stroke="var(--ring)" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="19" fill="none" stroke="var(--ring)" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="12" fill="var(--ring)"/>
      <circle cx="28" cy="28" r="5" fill="none" stroke="var(--paper)" stroke-width="1.5"/>
      <circle id="hit" cx="28" cy="28" r="2.6" fill="var(--olive)" opacity="0"/>
    </svg>
    <div>
      <h1>Powtórka do egzaminu</h1>
      <p class="sub">Baza 400 pytań egzaminacyjnych</p>
    </div>
  </header>

  <div class="modes" role="group" aria-label="Zakres pytań">
    <button id="mAll" aria-pressed="true">Wszystkie pytania</button>
    <button id="mWrong" aria-pressed="false">Do poprawki (<span id="wc">0</span>)</button>
  </div>

  <label class="sel"><span>Dział</span><select id="topic"></select></label>

  <div class="meta"><span id="pos"></span><span id="score"></span></div>
  <div class="bar"><i id="prog"></i></div>

  <main id="stage"></main>

  <div class="foot">
    <span>Pytanie wypada z poprawki po 2 dobrych odpowiedziach z rzędu</span>
    <span class="fbtns"><button class="ctrl" id="export">Kopiuj trudne pytania</button><button class="ctrl" id="reset">Wyczyść postęp</button></span>
  </div>
  <div id="exportBox" hidden>
    <p class="sub" id="exportMsg"></p>
    <textarea id="exportText" readonly rows="6"></textarea>
  </div>
</div>

<script>
const Q = [{"id":"p1","t":"Prawo karne","q":"Organ Policji cofa pozwolenie, jeżeli osoba, której pozwolenie wydano:","o":["została ukarana mandatem karnym","ma prawomocny wyrok przed sądem cywilnym","jest skazana prawomocnym orzeczeniem sądu za nieumyślne przestępstwo przeciwko życiu i zdrowiu."],"a":2,"e":""},{"id":"p2","t":"Prawo karne","q":"Kto porzuca broń lub amunicje, popełnia w myśl UoBiA?","o":["zbrodnie","eksces ekstensywny","przestępstwo"],"a":2,"e":""},{"id":"p3","t":"Prawo karne","q":"Kto porzuca broń palną lub amunicję, która pozostaje w jego dyspozycji, podlega karze","o":["dyscyplinarnej","grzywny, ograniczenia wolności albo pozbawienia wolności do lat 3","Grzywny, ograniczenia wolności albo pozbawienia wolności do lat 2"],"a":2,"e":""},{"id":"p4","t":"Prawo karne","q":"W przypadku naruszenia przez osobę posiadającą pozwolenie na broń, zasady użyczania broni osobie nieuprawnionej, organ Policji","o":["organ Policji cofa obligatoryjnie pozwolenie na broń","może cofnąć pozwolenie na broń","może dokonać przeszukania miejsca stałego pobytu"],"a":1,"e":""},{"id":"p5","t":"Prawo karne","q":"W przypadku naruszenia przez osobę posiadającą pozwolenie na broń obowiązku poddania się badaniom lekarskim i psychologicznym, właściwy organ Policji","o":["może cofnąć pozwolenie na broń","może ukarać sprawcę grzywną lub aresztem","obligatoryjnie cofa pozwolenie na broń"],"a":0,"e":""},{"id":"p6","t":"Prawo karne","q":"Kto bez wymaganej rejestracji posiada albo zbywa osobie nieuprawnionej broń pneumatyczną albo miotacz gazu obezwładniającego podlega karze?","o":["pozbawienia wolności do roku","grzywny","grzywny lub aresztu"],"a":2,"e":""},{"id":"p7","t":"Prawo karne","q":"Właściwy organ Policji, wobec osób, które posiadają broń, nie mając przy sobie legitymacji osoby dopuszczonej do posiadania broni i świadectwa broni może","o":["cofnąć sprawcy pozwolenie na broń","ukarać sprawcę kara grzywny","skierować na powtórne badania lekarskie"],"a":1,"e":""},{"id":"p8","t":"Prawo karne","q":"W przypadku naruszenia przez osobę posiadającą pozwolenie na broń obowiązku rejestracji broni, właściwy organ Policji","o":["aresztuje sprawcę","zwraca się z zadaniem natychmiastowej rejestracji broni","może cofnąć pozwolenie na broń"],"a":2,"e":""},{"id":"p9","t":"Prawo karne","q":"Kto narusza przepisy regulaminu określającego zasady zachowania bezpieczeństwa na strzelnicy, podlega karze?","o":["aresztu lub grzywny","grzywny, ograniczenia wolności albo pozbawienia wolności do roku","grzywny albo ograniczenia wolności"],"a":0,"e":""},{"id":"p10","t":"Prawo karne","q":"Kto nosi broń, znajdując się w stanie po użyciu alkoholu, środka odurzającego lub substancji psychotropowych albo środka zastępczego podlega karze","o":["aresztu lub pozbawienia wolności","aresztu, grzywny lub pozbawienia wolności, w zależności od stopnia upojenia","aresztu lub grzywny"],"a":2,"e":""},{"id":"p11","t":"Prawo karne","q":"Kto bez wymaganego pozwolenia posiada broń palną lub amunicję, podlega karze","o":["pozbawienia wolności od roku do lat 10","pozbawienia wolności od 6 miesięcy do lat 8","pozbawienia wolności od 6 miesięcy do lat 10"],"a":1,"e":""},{"id":"p12","t":"Prawo karne","q":"Kto bez wymaganego pozwolenia wyrabia broń palną albo amunicję, lub nią handluje, podlega karze:","o":["pozbawienia wolności od roku do lat 10","pozbawienia wolności od 6 miesięcy do lat 8","pozbawienia wolności od 6 miesięcy do lat 10"],"a":0,"e":""},{"id":"p13","t":"Prawo karne","q":"Kto przewozi broń i amunicję w kabinie pasażerskiego statku powietrznego, nie będąc do tego upoważnionym, podlega karze","o":["grzywny, ograniczenia wolności albo pozbawienia wolności do roku","aresztu lub grzywny","grzywny lub ograniczenia wolności"],"a":1,"e":""},{"id":"p14","t":"Prawo karne","q":"W przypadku używania przez osobę posiadającą pozwolenie na broń, broni w celach sportowych lub szkoleniowych poza strzelnicą, właściwy organ Policji","o":["może zażądać wykonania na koszt sprawcy ekspertyzyustalajacej, czy miejsce używania broni było bezpiecznie","może cofnąć pozwolenie na broń","obligatoryjnie odbiera pozwolenie na broń"],"a":1,"e":""},{"id":"p15","t":"Prawo karne","q":"W przypadku naruszenia przez osobę posiadającą pozwolenie na broń zasad przechowywania, noszenia oraz ewidencjonowania broni i amunicji, właściwy organ Policji","o":["zarządza kontrolę sposobu przechowywania broni i amunicji","może cofnąć pozwolenia na broń","odbiera pozwolenie na broń oraz orzeka przepadek broni"],"a":1,"e":""},{"id":"p16","t":"Prawo karne","q":"Właściwy organ Policji może cofnąć pozwolenie na broń w przypadku naruszenia przez osobę posiadająca pozwolenie","o":["konieczności posiadania miejsca zameldowania na terytorium Rzeczy Polskiej","obowiązku bezzwłocznej odpowiedzi na korespondencję ze strony Policji","obowiązku rejestracji broni"],"a":2,"e":""},{"id":"p17","t":"Prawo karne","q":"Kto nosi broń znajdując się w stanie po użyciu alkoholu, środka odurzającego lub substancji psychotropowej albo środka zastępczego podlega karze","o":["aresztu lub grzywny","grzywny, karze ograniczenia wolności lub pozbawienia wolności","ograniczenia wolności do lat 2"],"a":0,"e":""},{"id":"p18","t":"Prawo karne","q":"Po otrzymaniu ostatecznej decyzji administracyjnej o cofnięciu pozwolenia na broń, osoba, której pozwolenie cofnięto, jest zobowiązana zwrócić legitymację posiadacza broni w terminie","o":["48 godzin","5 dni","7 dni"],"a":2,"e":""},{"id":"p19","t":"Prawo karne","q":"Osoba dopuszczona do posiadania broni, podczas wykonywania zadań służbowych obowiązana jest posiadać przy sobie","o":["świadectwo broni, legitymacje osoby dopuszczonej do posiadania broni","świadectwo broni, notarialną kopie umowy zlecającej przewóz broni","świadectwo broni, dowód osobisty, legitymacje osoby dopuszczonej do posiadania broni"],"a":0,"e":""},{"id":"p20","t":"Prawo karne","q":"W przypadku naruszenia obowiązku zawiadomienia o utracie broni","o":["Właściwy organ Policji odbiera pozostała posiadana broń i umieszcza ja w depozycie","sprawca popełnia przestępstwo","właściwy organ Policji cofa pozwolenie na broń"],"a":2,"e":""},{"id":"p21","t":"Prawo karne","q":"Organ Policji obligatoryjnie cofa pozwolenie, jeżeli osoba, której pozwolenie wydano","o":["nie przestrzega obowiązku rejestracji broni w ciągu 5 dni od dnia zakupu","używa broni niezgodnie z administracyjnym celem jej posiadania","nie przestrzega warunków określonych w pozwoleniu na posiadanie broni"],"a":2,"e":""},{"id":"p22","t":"Prawo karne","q":"Kto przechowuje oraz nosi broń i amunicję w sposób umożliwiający dostęp do nich osób nieuprawnionych, podlega karze","o":["grzywny, ograniczenia wolności albo pozbawienia wolności do roku","aresztu albo grzywny","grzywny albo ograniczenia wolności"],"a":1,"e":""},{"id":"p23","t":"Prawo karne","q":"Właściwy organ Policji cofa dopuszczenie do posiadania broni, jeżeli osoba, której dopuszczenie takie wydano","o":["wykorzystuje dopuszczenie poza miejscem pracy, dla którego dopuszczenie wydano","nosi broń, znajdując się w stanie po użyciu alkoholu, środka zastępczego","naruszyła obowiązek pisemnego powiadomienia właściwego organu Policji o zmianie miejsca stałego pobytu"],"a":1,"e":""},{"id":"p24","t":"Prawo karne","q":"Kto posiada broń, nie mając przy sobie legitymacji posiadacza broni albo legitymacji osoby dopuszczonej do posiadania broni i świadectwa broni, podlega karze","o":["aresztu","grzywny","grzywny albo aresztu"],"a":1,"e":""},{"id":"p25","t":"Prawo karne","q":"Kto nie dopełnia obowiązku zawiadomienia Policji o utracie lub zbyciu innej osobie broni i amunicji do tej broni podlega karze","o":["utraty pozwolenia i całej posiadanej broni","pozbawienia wolności do 1 roku","aresztu lub grzywny"],"a":2,"e":""},{"id":"p26","t":"Prawo karne","q":"Kto narusza zakaz przesyłania broni lub amunicji za pośrednictwem podmiotów innych niż operatorzy świadczący usługi pocztowe, podlega karze","o":["aresztu albo grzywny","aresztu","grzywny"],"a":0,"e":""},{"id":"p27","t":"Prawo karne","q":"Posiadanie broni, nie mając przy sobie legitymacji osoby dopuszczonej do posiadania broni i świadectwa broni stanowi","o":["eksces ekstensywny","wykroczenie","przestępstwo"],"a":1,"e":""},{"id":"p28","t":"Prawo karne","q":"Organ Policji cofa pozwolenie, jeżeli osoba, której pozwolenie wydano","o":["jest uzależniona od alkoholu lub substancji psychoaktywnych","jest uzależniona od nikotyny","jest długotrwale bezrobotna"],"a":0,"e":""},{"id":"p29","t":"Prawo karne","q":"Kto nie dopełnia obowiązku rejestracji broni palnej podlega karze","o":["pozbawienia wolności do 1 roku","grzywny albo aresztu","grzywny"],"a":1,"e":""},{"id":"p30","t":"Prawo karne","q":"Kto przewozi broń lub amunicję środkami transportu publicznego, nie spełniając warunku prawidłowego zabezpieczenia, podlega karze","o":["grzywny albo ograniczenia wolności","grzywny, ograniczenia wolności albo pozbawienia wolności do roku","aresztu lub grzywny"],"a":2,"e":""},{"id":"p31","t":"Prawo karne","q":"Osoba będąca pod wpływem alkoholu lub innych środków odurzających, udział w zajęciach z bronią","o":["absolutnie nie może wziąć","może wziąć za zgodą prowadzącego","może wziąć udział, pod warunkiem ze jest to trening bez amunicji"],"a":0,"e":""},{"id":"p32","t":"Prawo karne","q":"Kto przywozi na terytorium RP z państwa spoza UE broń lub amunicję bez zaświadczenia właściwego konsula RP podlega karze","o":["aresztu albo pozbawienia wolności","aresztu albo grzywny","grzywny, ograniczenia wolności lub pozbawienia wolności"],"a":1,"e":""},{"id":"p33","t":"Prawo karne","q":"W przypadku noszenia broni mimo wykluczenia tej możliwości przez organ Policji poprzez adnotację w legitymacji posiadacza","o":["właściwy organ Policji kieruje na powtórne badania lekarskie","sprawca popełnia przestępstwo","właściwy organ Policji cofa pozwolenie na broń"],"a":2,"e":""},{"id":"p34","t":"Prawo karne","q":"W przypadku osób dopuszczonych do posiadania broni, niedopełnienie obowiązku zawiadomienia właściwego organu Policji o zmianie miejsca stałego pobytu w terminie 14 dni od dnia zmiany skutkować może","o":["cofnięciem dopuszczenia do posiadania broni","wysłaniem na ponowne badania lekarskie i psychologiczne","wszczęciem postępowania karnego"],"a":0,"e":""},{"id":"p35","t":"Prawo karne","q":"Kto nie dopełnia obowiązku zawiadomienia Policji o zmianie miejsca stałego pobytu w ciągu 14 dni od zmiany podlega karze","o":["grzywny do 150 stawek dziennych","aresztu lub grzywny","utraty pozwolenia na broń i całej posiadanej broni"],"a":1,"e":""},{"id":"p36","t":"Prawo karne","q":"W przypadku naruszenia przez osobę posiadającą pozwolenie na broń obowiązku uzyskania zgody na wywóz broni i amunicji za granicę, właściwy organ Policji","o":["może w przyszłości odmówić zgody na wywóz broni lub amunicji za granice","może cofnąć pozwolenie na broń","może ukarać sprawcę grzywną do 300 stawek dziennych"],"a":1,"e":""},{"id":"p37","t":"Prawo karne","q":"Kto nieumyślnie powoduje utratę broni palnej lub amunicji, która zgodnie z prawem pozostaje w jego dyspozycji, podlega","o":["grzywnie, karze ograniczenia wolności albo pozbawienia wolności do roku","grzywnie, karze ograniczenia wolności albo pozbawienia wolności do 2 lat","grzywnie lub karze ograniczenia wolności"],"a":0,"e":""},{"id":"p38","t":"Prawo karne","q":"Handlowanie amunicją bez zezwolenia to","o":["wykroczenie","przewinienie","przestępstwo"],"a":2,"e":""},{"id":"p39","t":"Prawo karne","q":"W przypadku naruszenia przez osobę posiadającą pozwolenie na broń obowiązku zawiadomienia właściwego organu Policji o zmianie miejsca stałego pobytu w terminie 14 dni od dnia zmiany, właściwy organ Policji","o":["może odebrać broń do depozytu policji na okres 3 lat","może cofnąć pozwolenie na broń","jest zobligowany przeszukać miejsce stałego pobytu"],"a":1,"e":""},{"id":"p40","t":"Prawo karne","q":"Kto używa w celach szkoleniowych lub sportowych broni zdolnej do rażenia celów na odległość poza strzelnicami, podlega karze","o":["aresztu albo grzywny","grzywny albo ograniczenia wolności","grzywny, ograniczenia wolności albo pozbawienia wolności do roku"],"a":0,"e":""},{"id":"p41","t":"Prawo karne","q":"Kto nie dopełnia obowiązku rejestracji broni popełnia","o":["przestępstwo","występek","wykroczenie"],"a":2,"e":""},{"id":"p42","t":"Prawo karne","q":"Kto, mając zezwolenie na posiadanie broni palnej lub amunicji, udostępnia lub przekazuje ją osobie nieuprawnionej podlega karze","o":["grzywny, ograniczenia wolności albo pozbawienia wolności do lat 2","grzywny, ograniczenia wolności albo pozbawienia wolności do roku","grzywny lub aresztu"],"a":0,"e":""},{"id":"p43","t":"Prawo karne","q":"Udostępnienie lub przekazanie broni palnej lub amunicji osobie nieupoważnionej stanowi","o":["wykroczenie","eksces intensywny","przestępstwo"],"a":2,"e":""},{"id":"p44","t":"Prawo karne","q":"Kto nie dopełnia obowiązku zawiadomienia Policji o utracie lub zbyciu broni palnej popełnia","o":["wykroczenie","zbrodnie","wykroczenie lub przestępstwo"],"a":0,"e":""},{"id":"p45","t":"Prawo karne","q":"Organ Policji cofa pozwolenie, jeżeli osoba, której pozwolenie wydano","o":["wielokrotnie została ukarana za wykroczenie w ruchu drogowym","jest przedmiotem postępowania przed sądem administracyjnym","jest skazana prawomocnym orzeczeniem sądu za umyślne przestępstwo skarbowe"],"a":2,"e":""},{"id":"p46","t":"Prawo karne","q":"Organ Policji cofa pozwolenie, jeżeli osoba, której pozwolenie wydano:","o":["nie ma obywatelstwa polskiego","nie posiada miejsca stałego pobytu na terenie Rzeczypospolitej Polskiej","wyjeżdża do pracy poza miejscem swojego stałego pobytu"],"a":1,"e":""},{"id":"p47","t":"Prawo karne","q":"Kto nie dopełnił obowiązku zwrotu legitymacji osoby dopuszczonej do posiadania broni, legitymacji posiadacza broni, karty rejestracyjnej broni lub europejskiej karty broni palnej podlega karze","o":["aresztu","aresztu albo grzywny","grzywny"],"a":1,"e":""},{"id":"p48","t":"Prawo karne","q":"Właściwy organ policji w stosunku do osoby posiadającej pozwolenie na broń, która przemieszcza się z rozładowaną bronią albo nosi broń, znajdując się w stanie po użyciu alkoholu, środka odurzającego lub substancji psychotropowych albo środka zastępczego","o":["jest zobligowany przeszukać miejsce stałego pobytu osoby","cofa pozwolenie na broń","cofa pozwolenie na broń, o ile osoba taka stanowi zagrożenie dla bezpieczeństwa i porządku publicznego"],"a":1,"e":""},{"id":"p50","t":"Obrona konieczna","q":"W razie przekroczenia granic stanu wyższej konieczności","o":["sąd może zastosować nadzwyczajne złagodzenie kary, a nawet odstąpić od jej wymierzenia","sąd wydaje wyrok uniewinniający, jeśli sprawca działał w dużym wzburzeniu","sąd może zastosować nadzwyczajne złagodzenie kary, jeśli sprawca zastosował sposób obrony niewspółmierny do niebezpieczeństwa zamachu"],"a":0,"e":""},{"id":"p52","t":"Obrona konieczna","q":"Obrona konieczna to działanie wyłącznie w celu","o":["uchylenia bezpośredniego niebezpieczeństwa grożącemu dobru chronionemu prawem","odparcia bezprawnego zamachu na dobro chronione prawem","odparcia bezpośredniego, bezprawnego zamachu na jakiekolwiek dobro chronione prawem"],"a":2,"e":""},{"id":"p53","t":"Obrona konieczna","q":"Stan wyższej konieczności jest to działanie wyłącznie w celu","o":["uchylenia bezpośredniego niebezpieczeństwa, grożącego jakiemukolwiek dobru chronionemu prawem, bądź ratowania dobra chronionego prawem, poświęcając dobro o wartości niższej od dobra ratowanego, jeżeli niebezpieczeństwa nie można uniknąć inaczej","ratowania ludzkiego zdrowia lub życia, niezależnie od rodzaju przestępstwa","odparcia bezpośredniego, bezprawnego zamachu na jakiekolwiek dobro chronione prawem"],"a":0,"e":""},{"id":"p54","t":"Obrona konieczna","q":"Stan wyższej konieczności określa, że nie popełnia przestępstwa ten, kto","o":["unika zamachu np. poprzez ukrycie się","ratuje ludzkie zdrowie lub życie, minimalizując liczbę ofiar","ratując dobro chronione prawem poświęca dobro, które nie przedstawia wartości oczywiście wyższej od dobra ratowanego"],"a":2,"e":""},{"id":"p55","t":"Obrona konieczna","q":"W ramach obrony koniecznej działa ten, kto odpiera bezpośredni, bezprawny zamach na","o":["jakiekolwiek dobro chronione prawem","mienie wysokiej wartości, zdrowie lub życie ludzkie, życie zwierzęcia,","wyłącznie zdrowie lub życie ludzkie"],"a":0,"e":""},{"id":"p56","t":"Obrona konieczna","q":"W razie przekroczenia granic stanu wyższej konieczności sąd nie zastosuje nadzwyczajnego złagodzenia kary, ani nie odstąpi od jej wymierzenia, jeśli","o":["sprawca uciekł z miejsca zdarzenia po fakcie","w wyniku działania sprawcy uszczerbku doznało ludzkie zdrowie lub życie","sprawca poświęcił dobro, które ma szczególny obowiązek chronić nawet z narażeniem się na niebezpieczeństwo osobiste"],"a":2,"e":""},{"id":"p57","t":"Obrona konieczna","q":"W ramach obrony koniecznej działa ten, kto:","o":["odpiera bezpośredni, bezprawny zamach na jakiekolwiek dobro chronione prawem","broni się przed przestępstwem","odpiera zamach na dobro prawem chronione"],"a":0,"e":""},{"id":"p58","t":"Obrona konieczna","q":"W ramach obrony koniecznej działa ten, kto odpiera zamach","o":["o dużych potencjalnych skutkach dla społeczeństwa","nagły i gwałtowny","bezpośredni i bezprawny"],"a":2,"e":""},{"id":"p59","t":"Obrona konieczna","q":"Stan wyższej konieczności to","o":["stan zagrożenia życia lub zdrowia ludzkiego","stan odpierania bezpośredniego, bezprawnego zamachu na jakiekolwiek dobro chronione prawem","stan, w którym grozi niebezpieczeństwo jakiemukolwiek dobru chronionemu prawem, jeżeli niebezpieczeństwa nie można inaczej uniknąć a dobro poświecone przedstawia wartość niższa od dobra ratowanego."],"a":2,"e":""},{"id":"p60","t":"Obrona konieczna","q":"Sąd może odstąpić od wymierzenia kary w razie przekroczenia granicy obrony koniecznej, gdy sprawca zastosował sposób obrony niewspółmierny do niebezpieczeństwa zamachu","o":["prawda","tylko, jeśli nie było ofiar","za zgodą Prokuratora"],"a":0,"e":""},{"id":"p62","t":"Obrona konieczna","q":"Nie podlega karze, kto przekracza granice obrony koniecznej","o":["pod wpływem strachu lub wzburzenia usprawiedliwionych okolicznościami zamachu","gdy miał na celu uniemożliwienie dokonania przestępstwa przeciwko życiu","gdy atak był gwałtowny i niespodziewany"],"a":0,"e":""},{"id":"p63","t":"Bezpieczeństwo","q":"Trening bezstrzałowy jest dozwolony","o":["rozładowaną bronią","na stanowisku strzeleckim lub innym miejscu wyznaczonym przez prowadzącego strzelanie i za jego zgodą","tylko na stanowisku strzeleckim, za zgodą prowadzącego strzelanie"],"a":1,"e":""},{"id":"p64","t":"Bezpieczeństwo","q":"Po komendzie \"ROZŁADUJ\" należy","o":["przerwać strzelanie, schować broń, i posprzątać stanowisko","rozładować broń, zabezpieczyć wskaźnikiem bezpieczeństwa i umieścić na stanowisku strzeleckim","rozładować broń, zabezpieczyć wskaźnikiem bezpieczeństwa i schować do futerału lub pokrowca"],"a":1,"e":""},{"id":"p65","t":"Bezpieczeństwo","q":"Każda osoba przebywająca na strzelnicy, w przypadku niezastosowania się do poleceń prowadzącego strzelanie może być","o":["usunięta ze strzelnicy","zatrzymana do przybycia patrolu Policji, który ją aresztuje","pozbawienia licencji zawodniczej"],"a":0,"e":""},{"id":"p66","t":"Bezpieczeństwo","q":"Składanie się, celowanie i strzelanie \"na sucho\" dozwolone jest","o":["na stanowisku strzeleckim lub innym miejscu wyznaczonym przez prowadzącego strzelanie i za jego zgodą","tylko po komendzie START","w dowolnym miejscu, przy zachowaniu warunków bezpieczeństwa"],"a":0,"e":""},{"id":"p67","t":"Bezpieczeństwo","q":"Po zakończeniu strzelania, przed opuszczeniem stanowiska broń","o":["musi zostać rozładowana, zabezpieczona i skontrolowana przez prowadzącego strzelanie","musi zostać rozładowana i wyczyszczona, a także skontrolowana przez prowadzącego","musi zostać schowana do kabury, pokrowca lub futerału"],"a":0,"e":""},{"id":"p68","t":"Bezpieczeństwo","q":"Strzelający powinni nosić","o":["identyfikator, ułatwiające prowadzącemu kontrolę tożsamości","licencje sportową w widocznym miejscu","ochronniki słuchu i wzroku"],"a":2,"e":""},{"id":"p69","t":"Bezpieczeństwo","q":"Czy prowadzący strzelanie może usunąć z terenu strzelnicy osobę naruszającą jej regulamin?","o":["Tylko za zgodą właściciela obiektu","Tak, osobę naruszającą regulamin można usunąć ze strzelnicy","tylko poprzez funkcjonariuszy"],"a":1,"e":""},{"id":"p70","t":"Bezpieczeństwo","q":"Za organizację działań o charakterze ratunkowym na strzelnicy jest odpowiedzialny","o":["osoba, która jako pierwsza dostrzeże zagrożenie","kierownik strzelnicy","sędzia główny, posiadający licencje sędziego sportowego przyznawana przez PZSS"],"a":1,"e":""},{"id":"p71","t":"Bezpieczeństwo","q":"Broń można ładować","o":["tylko poza stanowiskami strzeleckimi, aby nie przeszkadzać strzelającym lub prowadzącemu strzelanie","z pomocą innej osoby, jeśli strzelec nie jest w stanie zrobić tego samodzielnie","samodzielnie, na stanowisku strzeleckim, z lufą skierowaną w kulochwyt, tylko po komendzie ładuj"],"a":2,"e":""},{"id":"p72","t":"Bezpieczeństwo","q":"Zabrania się kierowania wylotu lufy w kierunku","o":["kulochwytu, tarcz lub przedmiotów będących celem na strzelnicy","bezpiecznym, jeżeli broń jest rozładowana","ludzi, zwierząt lub ptactwa"],"a":2,"e":""},{"id":"p73","t":"Bezpieczeństwo","q":"Za wydawanie komend \"ŁADUJ\", \"START\", \"STOP\", \"ROZŁADUJ\" jest odpowiedzialny","o":["prowadzący strzelanie lub zawodnik z najdłuższym stażem, jeśli nie ma prowadzącego","prowadzący strzelanie","kierownik strzelnicy"],"a":1,"e":""},{"id":"p74","t":"Bezpieczeństwo","q":"Dzieci mogą przebywać na terenie strzelnicy","o":["tylko powyżej 15 roku życia","wyłącznie pod bezpośrednim nadzorem rodziców lub opiekunów","tylko w ramach zajęć organizowanych przez klub sportowy lub szkole"],"a":1,"e":""},{"id":"p75","t":"Bezpieczeństwo","q":"O sytuacji, która może być niebezpieczna lub spowodować wypadek należy niezwłocznie powiadomić","o":["sędziego głównego","kierownika st ania Europejskiej Karty Broni palnej lub zgody właściwego organu Policji"],"a":2,"e":""},{"id":"p209","t":"Przepisy ogólne","q":"Organizator polowania, imprezy sportowej lub rekonstrukcji historycznej z udziałem cudzoziemców przekazuje, co najmniej na ile dni przed planowanym terminem wydarzenia - KWP właściwej ze względu na miejsce wydarzenia, pisemną informację o planowanej dacie i miejscu imprezy oraz przybliżonej liczbie uczestników?","o":["14 dni","5 dni","7 dni"],"a":2,"e":""},{"id":"p210","t":"Przepisy ogólne","q":"Czy dopuszcza się przesyłanie broni lub amunicji za pośrednictwem poczty?","o":["bezwzględnie nie","tak, ale wyłącznie za pośrednictwem operatorów świadczących swoje usługi na terenie RP","tak, ale za pośrednictwem operatorów świadczących usługi pocztowe, o ile świadczą oni tego rodzaju usługi"],"a":2,"e":""},{"id":"p211","t":"Przepisy ogólne","q":"Jeśli broń nie zostanie zbyta w terminie 30 dni od utraty uprawnienia do posiadania broni, należy","o":["złożyć oświadczenie o przeniesieniu własności broni i amunicji na rzecz Skarbu Państwa","złożyć broń wraz z amunicją do depozytu właściwego organu Policji","wyrazić zgodę na jej zniszczenie"],"a":1,"e":""},{"id":"p212","t":"Przepisy ogólne","q":"Osobom deklarującym zakup broni palnej lub amunicji w innym państwie członkowskim Unii Europejskiej właściwy terytorialnie komendant wojewódzki Policji, na ich wniosek, poświadcza","o":["uprzednią zgodę przewozową","zgodę przewozową","zgodę przewozową i uprzednią zgodę przewozową"],"a":0,"e":""},{"id":"p213","t":"Przepisy ogólne","q":"Osoba, której cofnięto dopuszczenie do posiadania broni, jest zobowiązana zwrócić dokumenty potwierdzające legalność posiadania broni i amunicji do właściwego organu Policji, w terminie","o":["14 dni od dnia otrzymania informacji o cofnięciu dopuszczenia do posiadania broni","30 dni licząc od dnia otrzymania decyzji o cofnięciu dopuszczenia do posiadani broni","7 dni od dnia otrzymania ostatecznej decyzji o cofnięciu dopuszczenia do posiadania broni"],"a":2,"e":""},{"id":"p214","t":"Przepisy ogólne","q":"Posiadacz pozwolenia na broń w przypadku sprzedaży broni palnej kolekcjonerskiej jest zobowiązany","o":["nie ciąży na posiadaczu pozwolenia żaden obowiązek w tym zakresie","niezwłocznie powiadomić pisemnie o tym fakcie właściwy organ Policji","powiadomić właściwy organ Policji w terminie 5 dni tylko w przypadku sprzedaży broni poza terytorium RP"],"a":1,"e":""},{"id":"p215","t":"Przepisy ogólne","q":"Osoba, nabywająca broń i amunicję w państwach niebędących państwami członkowskimi Unii Europejskiej, jeżeli nie posiada pozwolenia na broń, jest obowiązana:","o":["przekraczając granice Rzeczypospolitej Polskiej, do pisemnego zgłoszenia najbliższej jednostce Policji przywóz broni i amunicji","niezwłocznie złożyć przywożona broń i amunicje do depozytu właściwego organu celnego, a także, w terminie 14 dni od dnia przywozu broni na terytorium Rzeczypospolitej Polskiej, wstąpić do właściwego organu Policji z wnioskiem o wydanie pozwolenia na broń","zarejestrować broń w ciągu 5 dni od dnia nabycia"],"a":1,"e":"Art. 37 ust. 3: depozyt celny i 14 dni na wniosek. Rejestracja w 5 dni dotyczy osób, które już mają pozwolenie."},{"id":"p216","t":"Przepisy ogólne","q":"Poza funkcjonariuszami państwowych formacji uzbrojonych opisanych w, UoBiA, kto może być zwolniony z egzaminu przed Policją przy wydawaniu pozwolenia na broń?","o":["nikt więcej","o ile zdali taki egzamin na podstawie odrębnych przepisów członkowie PZL w zakresie broni myśliwskiej oraz członkowie PZSS posiadający licencje zezwalającą na uprawianie strzelectwa sportowego, w zakresie broni sportowej","członkowie stowarzyszenia kolekcjonerskich, obronnych, sportowych lub myśliwskich"],"a":1,"e":""},{"id":"p217","t":"Przepisy ogólne","q":"Obowiązek złożenia broni palnej i amunicji do depozytu zgodnie z treścią ustawy z dnia 21 maja 1999 r. o broni i amunicji nałożony jest na osobę, która","o":["zamierza poza granicami kraju dłużej niż 6 miesięcy","utrąciła prawo do posiadania broni palnej, jeżeli broń nie została zbyta w terminie 30 dni","posiadania broń technicznie niesprawna, a jej naprawa może być dokonana w okresie krótszym niż 3 miesiące"],"a":1,"e":""},{"id":"p218","t":"Przepisy ogólne","q":"Świadectwo broni może być wydane między innymi","o":["przedsiębiorca i jednostkom organizacyjnym, którzy na podstawie odrębnych przepisów powołali wewnętrzne służby zadań wynikających z planu ochrony","podmiotom wykonującym zadania związane z realizacja zabezpieczenia imprezy masowej","obie odpowiedzi są prawidłowe"],"a":0,"e":""},{"id":"p219","t":"Przepisy ogólne","q":"Cofnięcie pozwolenia na broń, dopuszczenia do posiadania broni oraz unieważnienie karty rejestracyjnej broni pneumatycznej następuje","o":["słownie lub pisemnie, jako wezwanie organu uprawnionego","w drodze decyzji administracyjnej","pisemnie- pismem dostarczonym za pokwitowaniem odbioru"],"a":1,"e":""},{"id":"p220","t":"Przepisy ogólne","q":"Czy osobie posiadającej broń, przeciwko której toczy się postępowanie karne o umyślne przestępstwa lub umyślne przestępstwa skarbowe, policja może za pokwitowaniem odebrać broń i amunicję oraz dokumenty potwierdzające legalność posiadania broni?","o":["tak, ale tylko do czasu prawomocnego zakończenia tego postępowania, na okres niedłuższy niż 7 lat","tak, ale tylko do czasu prawomocnego zakończenia tego postępowania, na okres niedłuższy niż 5 lat","tak, ale tylko do czasu prawomocnego zakończenia tego postępowania, na okres niedłuższy niż 3 lat"],"a":2,"e":""},{"id":"p221","t":"Przepisy ogólne","q":"Zaświadczenie uprawniające do nabycia broni ważne jest","o":["6 miesięcy","bezterminowo","3 miesiące"],"a":1,"e":""},{"id":"p222","t":"Przepisy ogólne","q":"Dozwolone jest użyczanie broni","o":["odpowiadającej celom szkoleniowym wyłącznie osobom prowadzącym strzelnice","odpowiadającej celom łowieckim i sportowym wyłącznie osobom posiadającym pozwolenie na broń wydane w celach łowieckich lub sportowych","odpowiadającej celom łowieckim i sportowym wyłącznie osobom posiadającym pozwolenie na broń wydane w celach ochrony osobistej oraz ochrony osób i mienia"],"a":1,"e":""},{"id":"p223","t":"Przepisy ogólne","q":"Przedsiębiorca, który uzyskał koncesję na prowadzenie działalności gospodarczej w zakresie usług ochrony osób i mienia, jeżeli broń jest mu niezbędna w zakresie i formach określonych w koncesji, po uzyskaniu świadectwa broni może wynajmować broń od","o":["podmiotów prowadzących strzelnice","organizacji sportowych i łowieckich","Policji lub Sil Zbrojnych Rzeczypospolitej Polskiej"],"a":2,"e":""},{"id":"p224","t":"Przepisy ogólne","q":"Przesyłanie broni i amunicji odbywa się za pośrednictwem","o":["podmiotów innych niż operatorzy świadczący usługi pocztowe","konwojowanych transportów broni i amunicji","operatorów świadczących usługi pocztowe"],"a":2,"e":""},{"id":"p225","t":"Przepisy ogólne","q":"Broń palna oraz inna broń zdolna do rażenia celów na odległość może być używana w celach szkoleniowych i sportowych","o":["o ile osoba strzelająca zachowuje warunki bezpieczeństwa","tylko na strzelnicach","nie może być używana"],"a":1,"e":""},{"id":"p226","t":"Przepisy ogólne","q":"O zmianie miejsca stałego pobytu informuje się","o":["organ Policji ze względu na stare miejsce stałego pobytu","organ wydający pozwolenie","organ Policji właściwy ze względu na nowe miejsce stałego zamieszkania"],"a":2,"e":""},{"id":"p227","t":"Przepisy ogólne","q":"O zmianie miejsca stałego pobytu, osoba posiadająca pozwolenie na broń jest zobowiązana powiadomić organ Policji","o":["w terminie 14 dni","obecnie robi to organ meldunkowy","w terminie do 7 dni"],"a":0,"e":""},{"id":"p228","t":"Przepisy ogólne","q":"Broń palna zdolna do rażenia celów na odległość może być używana w Strzelniach szkoleniowych","o":["na terenach leśnych pod warunkiem zapewnienia bezpieczeństwa","na strzelnicach","w miejscach zapewniających pełne bezpieczeństwo otoczenia"],"a":1,"e":""},{"id":"p229","t":"Przepisy ogólne","q":"Przywóz broni i amunicji z państw niebędących członkami Unii Europejskiej przez obywateli polskich wymaga","o":["uprzedniego wydania zaświadczenia przez władze państwa, z którego będzie przywożona","posiadania Europejskiej Karty Broni","posiadania zaświadczenia wydanego przez właściwego konsula Rzeczypospolitej Polskiej"],"a":2,"e":""},{"id":"p230","t":"Przepisy ogólne","q":"Zbywanie broni i amunicji do tej broni jest dopuszczalne","o":["po uzyskaniu zgody właściwego organu Policji ze wskazaniem nabywcy broni i amunicji","pomiędzy osobami posiadającymi pozwolenie na ten sam rodzaj broni","tylko i wyłącznie za pośrednictwem podmiotów zajmujących się obrotem (handlem) bronią i amunicja"],"a":1,"e":""},{"id":"p231","t":"Przepisy ogólne","q":"Broń i amunicja w czasie przewozu środkami transportu publicznego powinny","o":["być zabezpieczona w sposób uniemożliwiający powstanie zagrożenia życia, zdrowia lub mienia","znajdować się w pojemniku bezpiecznym lub w skrzyni metalowej o zamykanej, co najmniej jednym zamkiem o skomplikowanym mechanizmie","znajdować się w pojemniku służącym do transportu broni i amunicji, wyposażonym w urządzenie utrudniający jego zabór, wykorzystującym działanie alarmu akustycznego"],"a":0,"e":""},{"id":"p232","t":"Przepisy ogólne","q":"Cofnięcie dopuszczenia do posiadania broni następuje","o":["w drodze decyzji organu właściwego do wydawania pozwolenie","postanowienia organu Policji, który wcześniej wydal dopuszczenie do posiadania broni","w drodze decyzji podmiotu posiadającego broń (pracodawcy)"],"a":0,"e":""},{"id":"p233","t":"Przepisy ogólne","q":"Znalazca broni","o":["może wystąpić z wnioskiem o wydanie pozwolenia na znaleziona broń","nie ma żadnych praw względem znalezionej broni","może złożyć pisemne oświadczenie woli przeniesieniu własności znalezionej broni na rzecz Skarbu Państwa"],"a":1,"e":"Znalazca nie nabywa własności broni ani znaleźnego. Nie może przenieść własności, której nie ma (art. 23 ust. 2 wprost wyłącza znalazcę)."},{"id":"p234","t":"Przepisy ogólne","q":"Regulamin strzelnicy zatwierdza","o":["uchwala radnych miasta","organ Policji właściwy ze względu na adres strzelnicy","wójt, burmistrz lub prezydent miasta"],"a":2,"e":"Art. 47: organ gminy właściwy dla lokalizacji strzelnicy."},{"id":"p235","t":"Przepisy ogólne","q":"Policja może za pokwitowaniem odebrać broń, amunicję oraz dokumenty potwierdzające legalność posiadania broni osobie posiadającej broń, przeciwko której toczy się postępowanie karne o umyślne przestępstwo, do czasu prawomocnego zakończenia tego postępowania, na okres","o":["nie dłuższy niz. 3 lata","1 roku","do 2 lat"],"a":0,"e":"Art. 19 ust. 1a: do prawomocnego zakończenia postępowania, ale nie dłużej niż 3 lata."},{"id":"p236","t":"Przepisy ogólne","q":"Złożenie broni i amunicji do depozytu Policji","o":["ceduje zbycie broni i amunicji przez organ Policji, w którym broń i amunicje zdeponowano","uniemożliwia zbycie broni i amunicji","nie stanowi przeszkody do ich zbycia"],"a":2,"e":""},{"id":"p237","t":"Przepisy ogólne","q":"Szczegółowe zasady zachowania bezpieczeństwa na strzelnicy określa","o":["regulamin strzelnicy","instrukcja szkolenia pracowników ochrony","prowadzący strzelanie przed rozpoczęciem strzelania"],"a":0,"e":""},{"id":"p238","t":"Przepisy ogólne","q":"Posiadacz broni, w przypadku jej utraty, zobowiązany jest niezwłocznie powiadomić o tym fakcie policję, nie później jednak niż w ciągu","o":["48 godzin od chwili stwierdzenia utraty broni","24 godzin od chwili stwierdzenia utraty broni","12 godzin od chwili stwierdzenia utraty broni"],"a":1,"e":""},{"id":"p239","t":"Przepisy ogólne","q":"Jednostkami organizacyjnymi uprawnionymi do deponowania broni i amunicji są?","o":["Policja, Żandarmeria Wojskowa lub organ celny","powiatowa Komenda Policji","Wojewódzka Komenda Policji"],"a":0,"e":""},{"id":"p240","t":"Przepisy ogólne","q":"Osoba, która występuje z podaniem o wydanie dopuszczenia do posiadania broni jest zobowiązana","o":["przedstawić zaświadczenie potwierdzające fakt zatrudnienia w podmiocie posiadającym broń na \"okaziciela\"","zdać egzamin przed komisją powołana przez właściwy organ Policji ze znajomości przepisów dot. posiadania i używania danej broni oraz umiejętności posługiwania się ta Bronia","przedstawić aktualne zaświadczenie lekarskie"],"a":1,"e":""},{"id":"p241","t":"Przepisy ogólne","q":"Broni odpowiadającej celom łowieckim i broni odpowiadającej celom sportowym oraz amunicji do takiej broni można użyczać","o":["za zgodą organu Policji, który wydal pozwolenie na te broń","osobom posiadającym pozwolenie na broń wydane w celach łowieckich lub sportowych","nie można użyczać"],"a":1,"e":""},{"id":"p242","t":"Przepisy ogólne","q":"Legitymacja posiadacza broni upoważnia do","o":["użyczania broni na strzelnicy","zakupu amunicji.22Ir, o ile została wydana do celów sportowych","przemieszczania się z Bronia palna"],"a":2,"e":""},{"id":"p243","t":"Przepisy ogólne","q":"Posiadacz broni w przypadku jej utraty jest zobowiązany niezwłocznie zawiadomić o tym","o":["Policje lub Żandarmerie Wojskowa","Komendanta Wojewódzkiego Policji odpowiedniego miejscu zamieszkania osoby, która utraciła broń","Komendanta Powiatowego Policji odpowiedniego dla miejsce, w, którym broń została utracona"],"a":0,"e":""},{"id":"p244","t":"Przepisy ogólne","q":"Zbywający broń i amunicję do tej broni obowiązany jest powiadomić o tym fakcie właściwy organ Policji","o":["niezwłocznie","w czasie do 24 godzin od chwili zbycia broni lub amunicji","w ciągu 5 dni od dnia zbycia broni lub amunicji"],"a":0,"e":""},{"id":"p245","t":"Przepisy ogólne","q":"Od egzaminu przed komisją powołaną przez właściwy organ Policji ze znajomości przepisów dotyczących posiadania i używania broni oraz umiejętności posługiwania się nią zwolnieni są:","o":["wyłącznie funkcjonariusze państwowych formacji uzbrojonych i żołnierze Sil zbrojnych RP","m.in. członkowie PZSS posiadający licencje zezwalająca na uprawianie strzelectwa sportowego, w zakresie broni sportowej, jeśli zdali taki egzamin na podstawie odrębnych przepisów","osoby posiadające minimum 3 klasę sportową na wniosek odpowiedniego Wojewódzkiego Związku Sportowego"],"a":1,"e":""},{"id":"p246","t":"Przepisy ogólne","q":"Czy występujący z podaniem o wydanie pozwolenia na broń jest zobowiązany zdać egzamin z przepisów dotyczących posiadania i używania danej broni oraz z umiejętności posługiwania się tą bronią?","o":["nie, za wyjątkiem osób występujących o broń w celu ochrony osobistej lub ochrony osób mienia","tak, za wyjątkiem osób zwolnionych z egzaminu zgodnie z UoBiA","tak"],"a":1,"e":""},{"id":"p247","t":"Przepisy ogólne","q":"Osoba, która utraciła uprawnienie do posiadania broni, jest obowiązana niezwłocznie","o":["przekazać broń najbliższej jednostce organizacyjnej Policji","zdać broń i amunicje do tej broni do depozytu prowadzonego przez organ Policji, który cofnął pozwolenie do posiadania broni","zbyć broń i amunicje do tej broni"],"a":2,"e":""},{"id":"p248","t":"Pozwolenia","q":"Organ Policji wydaje pozwolenie na broń, jeżeli wnioskodawca","o":["w okresie ostatnich 5 lat nie był skazany prawomocnym wyrokiem za przestępstwo umyślne","nie stanowi zagrożenia dla samego siebie, porządku lub bezpieczeństwa publicznego oraz przedstawi ważna przyczynę posiadania broni","udokumentuje potrzebę posiadania broni, złoży odpowiednio wypełniony wniosek wraz z oplata skarbowa"],"a":1,"e":""},{"id":"p249","t":"Pozwolenia","q":"Czy organy Policji mają prawo zobowiązać posiadacza pozwolenia na broń do poddania się badaniom lekarskim i psychologicznym?","o":["nie","tak, ale tylko wówczas, gdy posiadacz broni popełnił przestępstwo lub wykroczenie związane z użyciem lub wykorzystaniem broni w celach innych niz. określono w pozwoleniu na broń","tak, ale w przypadku, gdy istnieje uzasadnione podejrzenie ze osoba taka wykazuje istotne zaburzenia funkcjonowania psychologicznego, uzależnienie od alkoholu lub substancji psychoaktywnych, ograniczona sprawność psychofizyczna oraz zaburzenia psychiczne, o których mowa w ustawie o ochronie zdrowia psychicznego"],"a":2,"e":""},{"id":"p250","t":"Pozwolenia","q":"Pozwolenie na broń jest wydawane na czas:","o":["5 lat od momentu złożenia wniosku do właściwego organu Policji","nieokreślony","nieokreślony, pod warunkiem przedstawiania, co 7 lat aktualnych badan lekarskich"],"a":1,"e":""},{"id":"p251","t":"Pozwolenia","q":"Nabywca broni jest obowiązany zarejestrować ją w ciągu","o":["5 dni od dnia nabycia","7 dni od nabycia","24 godzin od dnia nabycia"],"a":0,"e":""},{"id":"p252","t":"Pozwolenia","q":"Pozwolenie na broń wydane do celów sportowych, uprawnia do posiadania broni","o":["broni wskazywanej przez regulamin Międzynarodowej Federacji Sportu Strzeleckiego","bocznego zapłonu z lufami gwintowanymi o kalibrze do 6 mm; centralnego zapłonu z lufami gwintowanymi o kalibrze do 12 mm; gładkolufowej; przystosowanej do strzelania wyłącznie przy pomocy prochu czarnego","bocznego zapłonu z lufami niegwintowanymi o kalibrze do 6 mm; centralnego zapłonu z lufami gwintowanymi o kalibrze do 15 mm; przystosowanej do strzelania wyłącznie przy pomocy prochu czarnego"],"a":1,"e":""},{"id":"p253","t":"Pozwolenia","q":"Czy osoba skazana prawomocnym orzeczeniem sądu za nieumyślne przestępstwo przeciwko życiu i zdrowiu może otrzymać pozwolenie na broń?","o":["tak","tak, jeśli uzyska pozytywna opinie dzielnicowego","nie"],"a":2,"e":"Art. 15 ust. 1 pkt 6 lit. b."},{"id":"p254","t":"Pozwolenia","q":"Czy osoba nieposiadająca miejsca stałego pobytu na terytorium RP może otrzymać pozwolenie na broń?","o":["Tak, jeśli bywa w kraju regularnie","nie","Tylko, jeśli ma w RP majątek lub rodzinę"],"a":1,"e":""},{"id":"p255","t":"Pozwolenia","q":"Do kategorii broni szczególnie niebezpiecznej zalicza się","o":["broń palna wytworzona lub przerobiona w sposób pozwalający na zatajenie jej przeznaczenia, a także broni imitującej inne przedmioty","pistolety z magazynkami o pojemności 20 nabojów, niezależnie od celów posiadania","broń samopowtarzalna, wytworzona z broni samoczynnej"],"a":0,"e":""},{"id":"p256","t":"Pozwolenia","q":"Pozwolenie na broń wydane do celów łowieckich, uprawnia do posiadania broni","o":["dopuszczonej do wykonywania polowań na podstawie odrębnych przepisów","centralnego zapłonu z lufami gwintowanymi o kalibrze do 12 mm, broni gładkolufowej","dopuszczonej do wykonywania polowań na podstawie odrębnych przepisów oraz broni palnej w postaci pistoletów lub rewolwerów."],"a":0,"e":"Ustawa odsyła do przepisów łowieckich. Pistoletów i rewolwerów tu nie ma."},{"id":"p257","t":"Pozwolenia","q":"Pozwolenie na broń wydane do celów ochrony osobistej, uprawnia do posiadania","o":["broni palnej: bojowej, gazowej, alarmowej w postaci pistoletów lub rewolwerów centralnego zapłonu o kalibrach od 6 mm do 12 mm, przedmiotów przeznaczonych do obezwładniania osób za pomocą energii elektrycznej o średniej wartości w obwodzie przekraczającej 10 mA, miotaczy gazu obezwładniającego","broni palnej w postaci pistoletów, rewolwerów lub karabinów centralnego zapłonu o kalibrach od 6 mm do 12 mm, pistoletów sygnałowych, miotaczy gazu obezwładniającego","broni palnej: bojowej, gazowej, alarmowej w postaci pistoletów lub rewolwerów centralnego zapłonu o kalibrach od 6 mm do 12 mm lub w postaci strzelb gładkolufowych"],"a":0,"e":"Ochrona osobista to tylko broń krótka i środki obezwładniające. Karabiny i strzelby odpadają."},{"id":"p258","t":"Pozwolenia","q":"Czy dopuszcza się nabywanie broni przy użyciu środków porozumiewania się na odległość?","o":["tak, ale wcześniej nabywca ( w przypadku, gdy posiada miejsce stałego pobytu lub siedzibę na terytorium RP) dostarcza zbywcy, mającemu miejsce stałego pobytu lub siedzibę na terytorium innego niż RP państwa, zgodę przewozowa i upoważnienie władz swojego państwa do nabycia danego rodzaju i liczby broni palnej","tak, ale wcześniej nabywca( w przypadku, gdy posiada miejsce stałego pobytu lub siedzibę na terytorium) dostarcza zbywcy, mającemu również miejsce stałego pobytu lub siedzibę na terytorium RP, zaświadczenie uprawniające do jej nabycia","nie dopuszcza się w ten sposób nabywania broni, chyba że posiada się do tego celu upoważnienie swojego państwa"],"a":1,"e":"Art. 12a ust. 2 pkt 1: przed wydaniem broni promesa. Zgoda przewozowa dotyczy nabywców z zagranicy."},{"id":"p259","t":"Pozwolenia","q":"Za ważną przyczynę posiadania broni do celów kolekcjonerskich uważa się w szczególności","o":["udokumentowane członkostwo w stowarzyszeniu o charakterze kolekcjonerskim","zbieranie starych wojskowych kocy","udokumentowane członkostwo w stowarzyszeniu o charakterze kolekcjonerskim, udokumentowana działalność kolekcjonerską i potwierdzone zaangażowanie w kolekcjonerstwo"],"a":0,"e":""},{"id":"p261","t":"Pozwolenia","q":"Czy osoba uzależniona od alkoholu lub substancji psychoaktywnych może otrzymać pozwolenie na broń?","o":["Tak, jeśli jest niekarana","Tylko, jeśli dobrze funkcjonuje w społeczeństwie","Nie"],"a":2,"e":""},{"id":"p262","t":"Pozwolenia","q":"Pozwolenia na broń nie wymaga się między innymi w przypadku","o":["posiadania broni palnej o kalibrze powyżej 6 mm","posiadania przedmiotów przeznaczonych do obezwładniania osób za pomocą energii elektrycznej o średniej wartości prądów w obwodzie przekraczającej 10 mA","gromadzenia broni w zbiorach muzealnych na podstawie odrębnych przepisów"],"a":2,"e":""},{"id":"p263","t":"Pozwolenia","q":"Amunicję można nabywać","o":["na podstawie zaświadczenia uprawniającego do zakupu amunicji, wystawionego przez właściwy organ policji","na podstawie legitymacji posiadacza broni lub świadectwa broni, wyłącznie do broni określonej w legitymacji","na podstawie zakupu broni"],"a":1,"e":""},{"id":"p264","t":"Pozwolenia","q":"Dopuszczenie do posiadania broni wydaje się osobom mającym ukończonych","o":["18 lat","21 lat","16 lat"],"a":1,"e":""},{"id":"p265","t":"Pozwolenia","q":"Broń palną pozbawioną cech użytkowych można posiadać na podstawie","o":["legitymacji osoby dopuszczonej do posiadani broni","karty rejestracyjnej broni pozbawionej cech użytkowych wydanej przez właściwego ze względu na miejsce pobytu zainteresowanej osoby lub siedzibę zainteresowanego podmiotu komendanta wojewódzkiego Policji, a w przypadku żołnierzy zawodowych- właściwego komendanta oddziału Żandarmerii Wojskowej","dowodu zakupu i świadectwa broni"],"a":1,"e":""},{"id":"p266","t":"Pozwolenia","q":"Nie wymaga się pozwolenia na broń","o":["otrzymana na drodze spadku lub darowizny","podczas używania broni w celach sportowych, szkoleniowych lub rekreacyjnych na strzelnicy działającej na podstawie zezwolenia właściwego organu","posiadana do celów pamiątkowych"],"a":1,"e":""},{"id":"p267","t":"Pozwolenia","q":"Do jakich rodzajów broni i amunicji uprawnia pozwolenie na broń wydane w celu ochrony osobistej?","o":["Pistoletów maszynowych o kalibrze od 6 mm do 12 mm","broni palnej: bojowej, gazowej, alarmowej w postaci pistoletów lub rewolwerów centralnego zapłonu o kalibrach od 6 mm do 12 mm","karabinków samoczynnych o kalibrze od 5, 45 mm do 7, 62 mm"],"a":1,"e":""},{"id":"p268","t":"Pozwolenia","q":"Pozwolenie na broń służącą do celów szkoleniowych nie może być wydane na","o":["broń palna wytworzona lub przerobiona w sposób pozwalający na zatajenie jej przeznaczenia, a także broń imitująca inne przedmioty","samoczynna broń palna w postaci pistoletów maszynowych o kalibrze od 6 mm do 12 mm","broń palna centralnego zapłonu z lufami gwintowanymi, o kalibrze do 12 mm"],"a":0,"e":""},{"id":"p269","t":"Pozwolenia","q":"Pozwolenie na broń może być wydane między innymi w celu","o":["ochrony osób i mienia","prewencyjnym","obrony własnej"],"a":0,"e":""},{"id":"p270","t":"Pozwolenia","q":"Za ważną przyczynę posiadania broni do celów pamiątkowych uważa się w szczególności","o":["wykonywanie zawodu o charakterze szczególnie niebezpiecznym dla życia i zdrowia","udokumentowane nabycie broni w drodze spadku, darowizny lub wyróżnienia","otrzymywanie pogróżek od nieznanych osób"],"a":1,"e":""},{"id":"p271","t":"Pozwolenia","q":"Do kategorii amunicji szczególnie niebezpiecznej zalicza się amunicję:","o":["wytworzona niefabrycznie, z wyłączeniem amunicji wytwarzanej na własny użytek przez osoby posiadające pozwolenie na broń myśliwską, pamiątkową lub kolekcjonerską","wytworzona niefabrycznie, z wyłączeniem amunicji wytwarzanej na własny użytek przez osoby posiadające pozwolenie na broń myśliwską, sportową lub kolekcjonerską","wytwarzana niefabrycznie, z wyłączeniem amunicji wytwarzanej na własny użytek przez osoby posiadające pozwolenie na broń pamiątkową, sportową lub kolekcjonerską"],"a":1,"e":"Elaborować mogą myśliwi, sportowcy i kolekcjonerzy. Pamiątkowe tego nie daje."},{"id":"p272","t":"Pozwolenia","q":"Pozwolenie na broń służącą do celów kolekcjonerskich nie może być wydane na","o":["broń palną, której nie można wykryć przy pomocy przeznaczonych do kontroli osób i bagażu","broń dopuszczoną do wykonywania polowań na podstawie odrębnych przepisowo","karabiny wyborowe z optycznymi przyrządami celowniczymi o donośności powyżej 1200 m"],"a":0,"e":""},{"id":"p273","t":"Pozwolenia","q":"Amunicją szczególnie niebezpieczną jest amunicja","o":["z pociskami nadkalibrowymi, z płaszczem lub elementem wiodącym wykonanym z tworzyw sztucznych, z wyłączeniem amunicji przeznaczonej do strzelania z broni gładkolufowej","z pociskami podkalibrowymi, z płaszczem lub elementem wiodącym wykonanym z tworzyw sztucznych, z wyłączeniem amunicji przeznaczonej do strzelania z broni gładkolufowej","z pociskami szkolnymi, z płaszczem lub elementem wiodącym wykonanym z tworzyw sztucznych, z wyłączeniem amunicji przeznaczonej do strzelania broni gładkolufowej"],"a":1,"e":"Pocisk podkalibrowy siedzi w plastikowym sabocie, ma dużą przebijalność. Breneki sabotowe do strzelb są wyłączone."},{"id":"p274","t":"Pozwolenia","q":"Pozwolenia na broń nie wymaga się w przypadku","o":["posiadania broni palnej rozdzielnego ładowania wykonanej przed rokiem 1995","posiadania broni w celu pamiątkowym","używania broni w celach sportowych, szkoleniowych lub rekreacyjnych na strzelnicy działającej na podstawie zezwolenia właściwego organu"],"a":2,"e":""},{"id":"p275","t":"Pozwolenia","q":"Legalność posiadania broni przez osoby dopuszczone do posiadania broni potwierdza się w","o":["legitymacji osoby dopuszczonej do posiadania broni","legitymacji posiadacza broni","świadectwa broni"],"a":0,"e":""},{"id":"p276","t":"Pozwolenia","q":"Pozwolenie na broń wydane do celów sportowych, uprawnia do posiadania broni","o":["pistoletów sygnałowych","gładkolufowej","broni alarmowej w postaci rewolwerów centralnego zapłonu o kalibrze od 6 do 12 mm"],"a":1,"e":"Sport obejmuje broń kulową i gładkolufową (trap, skeet). Alarmowa 6–12 mm to ochrona osobista."},{"id":"p277","t":"Pozwolenia","q":"Jaką ważność mają badania lekarskie, które należy dołączyć do wniosku o pozwolenie na broń lub dopuszczenie do broni?","o":["3 miesiące, licząc od daty złożenia wniosku o pozwolenie lub dopuszczenie","3 miesiące, licząc od daty badania","1 miesiąc"],"a":1,"e":""},{"id":"p278","t":"Pozwolenia","q":"Zarejestrowanie broni wymagającej pozwolenia potwierdza się","o":["W legitymacji posiadacza broni lub w świadectwie broni","oddzielna decyzja administracyjna wydana przez właściwy organ Policji lub Żandarmerii Wojskowej","wyłącznie w dokumentach posiadacza broni przechowywanych przez właściwy organ Policji lub Żandarmerii Wojskowej"],"a":0,"e":""},{"id":"p279","t":"Pozwolenia","q":"Pozwolenie na broń służącą do celów kolekcjonerskich może być wydane na","o":["broń palną centralnego zapłonu z lufami gwintowanymi, o kalibrze do 12 mm","samoczynną broń palna w postaci pistoletów maszynowych o kalibrze od 6 mm do 12 mm","broń palną wytworzona lub przerobiona w sposób pozwalający na zatajenie jej przeznaczenia, a także broń imitujący inne przedmioty"],"a":0,"e":""},{"id":"p280","t":"Pozwolenia","q":"Pozwolenie na broń wydane do celów kolekcjonerskich, nie uprawnia do posiadania następujących rodzajów broni:","o":["broni palnej bojowej, gazowej, alarmowej w postaci pistoletów lub rewolwerów centralnego zapłonu o kalibrach od 6 mm do 12 mm","samoczynnej broni palnej, zdolnej do rażenia celów na odległość","broni alarmowej albo innej broni palnej, konstrukcyjne przeznaczonej do strzelania wyłącznie amunicja ślepa, w tym samoczynnej"],"a":1,"e":""},{"id":"p281","t":"Pozwolenia","q":"Zarejestrowanie broni wymagającej pozwolenia potwierdza się w","o":["obie odpowiedzi są prawdziwe","świadectwie broni","legitymacji posiadacza broni"],"a":0,"e":""},{"id":"p282","t":"Pozwolenia","q":"Bronią szczególnie niebezpieczną jest","o":["każda przenośna broń lufowa, która miota, jest przeznaczona do miotania lub może być przystosowana do miotania jednego lub większej liczby pocisków lub substancji w wyniku działania materiału miotającego","broń palna, wyposażona w tłumik huku lub przystosowana do strzelania z użyciem tłumika huku","broń zbudowana w oparciu o szkielet broni, lufę z komorą nabojową, zamek oraz magazynek lub bęben nabojowy"],"a":1,"e":""},{"id":"p283","t":"Pozwolenia","q":"Osoba posiadająca pozwolenie na broń wydane w celu ochrony osobistej obowiązana jest raz na 5 lat przedstawić właściwemu organowi Policji orzeczenia lekarskie i psychologiczne potwierdzające, że może dysponować bronią, wystawione nie wcześniej niż","o":["2 miesiące przed upływem tego terminu","1 miesiąc przed upływem tego terminu","3 miesiące przed upływem tego terminu"],"a":2,"e":""},{"id":"p284","t":"Pozwolenia","q":"Pozwolenie na broń wydane do celów sportowych, uprawnia do posiadania broni","o":["gazowej w kalibrze od 6 mm do 12 mm","centralnego zapłonu z lufami gwintowanymi o kalibrze do 12 mm","przeznaczonej do strzelania wyłącznie amunicja ślepa, w tym samoczynnej"],"a":1,"e":""},{"id":"p285","t":"Pozwolenia","q":"Posiadacze pozwoleń do celów kolekcjonerskich mogą nosić broń","o":["przemieszczając się na strzelnice","wyłącznie za zgodą właściwego organu Policji","ukryta i w kaburze lub futerale"],"a":1,"e":"Art. 10 ust. 8. Noszenie to przemieszczanie załadowanej broni. Rozładowaną można przewieźć."},{"id":"p286","t":"Pozwolenia","q":"Czy ważność Europejskiej karty broni palnej po upływie okresu ważności może zostać przedłużona?","o":["nie, nie może być przedłużona","tak, jednorazowo na okres 3 miesięcy","tak, może być przedłużona na kolejny okres"],"a":2,"e":""},{"id":"p287","t":"Pozwolenia","q":"Pozwolenia na broń nie wymaga się między innymi w przypadku","o":["wzięcia w użyczenie broni odpowiadającej celom sportowym lub łowieckim","posiadania broni palnej pozbawionej cech użytkowych","posiadania broni palnej o kalibrze do 9 mm"],"a":1,"e":""},{"id":"p288","t":"Pozwolenia","q":"Czy ustawodawca zabrania noszenia broni posiadanej na podstawie pozwolenia (bez zgody właściwego organu policji)?","o":["tak, ale dotyczy to wyłącznie broni posiadanej do celów kolekcjonerskich lub pamiątkowych","tak, ale dotyczy to wyłącznie broni szczególnie niebezpiecznej","tak, ale dotyczy to wyłącznie broni posiadanej w celach rekonstrukcji historycznych"],"a":0,"e":""},{"id":"p289","t":"Pozwolenia","q":"Broń palną i amunicję do tej broni można posiadać","o":["na podstawie pozwolenia na broń wydanego przez komendanta wojewódzkiego Policji, bez wzgledu na miejsce zamieszkania zainteresowanej osoby lub siedzibe zainteresowanego podmiotu, a w przypadku żołnierzy zawodowych- na podstawie pozwolenia wydanego przez właściwy organ wojskowy","na podstawie pozwolenia na broń wydanego przez własciwego ze wzgledu na miejsce stałego pobytu zainteresowanej osoby lub siedzibę zainteresowanego podmiotu komendanta wojewódzkiego Policji, a W przypadku żołnierzy zawodowych - na podstawie pozwolenia wydanego przez właściwego komendanta oddziału Żandarmerii Wojskowej","na podstawie pozwolenia na broń wydanego przez właściwego, ze wzgledu na miejsce zamieszkania zainteresowanej osoby lub siedzibę zainteresowanego podmiotu, komendanta powiatowego Policji, a w przypadku żołnierzy zawodowych. Na podstawie pozwolenia wydanego pr
