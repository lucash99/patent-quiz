ypadku przechowywania jej poza urządzeniami spełniającymi wymagania, co najmniej klasy S1 z normy PN-EN 14450, obowiązana jest","o":["wymagane są oba zabezpieczenia opisane w odpowiedziach B i C jednocześnie","drzwi wejściowe do pomieszczenia, w którym jest przechowywana broń i amunicja, zabezpieczyć blachą stalową o grubości co najmniej 2 mm i wyposażyć w blokadę przeciwwyważeniową oraz zamknięcie przynajmniej na jeden zamek co najmniej klasy 7 z normy PN-EN 12209 i zasuwę drzwiową zamykaną na kłódkę co najmniej klasy 5 z normy PN-EN 12320","zabezpieczyć okna przez zamontowanie krat, siatki, żaluzji antywłamaniowych spełniających wymagania co najmniej normy PN-EN 1627 albo szyb o podwyższonej odporności co najmniej P4A z normy PN-EN 356"],"a":0,"e":""},{"id":"p353","t":"Przechowywanie i noszenie","q":"Magazyn broni stanowi oddzielne pomieszczenie w budynku o konstrukcji niepalnej, wydzielone ścianami murowanymi, usytuowane w miarę możliwości na piętrze, posiadające m.in.:","o":["dwa zamki kluczowe o skomplikowanym mechanizmie z zabezpieczeniem antywłamaniowym","zabezpieczenie systemem sygnalizacji pożarowej z transmisja sygnału alarmu do pełniącego całodobowy dyżur pracownika monitoringu","skrzynie z piaskiem lub inne urządzenie służące do przechwytywania pocisków, z oznaczeniem \" TU KIERUJ BRON\", w miejscu ładowania i rozładowania broni"],"a":2,"e":""},{"id":"p354","t":"Przechowywanie i noszenie","q":"Broń przechowuje się w","o":["odpowiednio przystosowanym do tego pomieszczeniu zwanym \"magazynem broni\" lub w urządzeniach spełniających wymagania, co najmniej klasy S1 z normy PN-EN 14450","szafach stalowych lub sejfach posiadających zamki atestowane, trwale przymocowanych do elementów konstrukcyjnych budynku","w pomieszczeniu zamkniętym drzwiami spełniającymi wymagania, o których mowa w normie PN-EN 1627 plombowanych lub zaopatrzonych w inny wskaźnik sygnalizujący wejście osób nieuprawnionych."],"a":0,"e":""},{"id":"p355","t":"Przechowywanie i noszenie","q":"Broń w liczbie powyżej 50 egzemplarzy przechowuje się w","o":["odpowiednio przystosowanym do tego pomieszczeniu zwanym \"magazynem broni\" w urządzeniach spełniających wymagania, co najmniej klasy S1 z normy PN-EN 14450","w urządzeniach spełniających wymagania, co najmniej klasy S1 z normy PN-EN 14450","w pomieszczeniu zamkniętym drzwiami spełniającymi wymagania, o których mowa w normie PN-EN 1627, plombowanych lub zaopatrzonych w inny wskaźnik sygnalizujący wejście osób nieuprawnione wejście"],"a":0,"e":""},{"id":"p356","t":"Przechowywanie i noszenie","q":"W magazynie broni przechowuje się następującą dokumentację","o":["wykazy pracowników upoważnionych do pobierania broni i amunicji z magazynu, książkę wydania -przyjęcia broni i amunicji, karty rozchodu amunicji","książkę stanu uzbrojenia, książkę rejestru otwierania i zamykania magazynu broni, protokóły i listy","ewidencje posiadanej broni i amunicji, wraz z kopiami dokumentów zakupu broni i amunicji"],"a":2,"e":""},{"id":"p357","t":"Przechowywanie i noszenie","q":"Zasady i warunki przechowywania, noszenia oraz ewidencjonowania broni i amunicji przez osoby posiadające broń i amunicję na podstawie pozwolenia określa","o":["Ustawa z dnia 21 Maja 1999 r. o broni i amunicji","Ustawa z dnia 21 Maja 1999 r. o broni i amunicji z późniejszymi zmianami","Rozporządzenie Ministra Spraw Wewnętrznych w sprawie przechowywania, noszenia oraz ewidencjowania broni i amunicji"],"a":2,"e":""},{"id":"p358","t":"Przechowywanie i noszenie","q":"Osoby posiadające broń i amunicję do broni palnej w celach kolekcjonerskich oraz pamiątkowych, w przypadku przechowywania tej broni i amunicji poza urządzeniami klasy S1, mogą je przechowywać w gablotach przeznaczonych do przechowywania broni po spełnieniu następujących warunków","o":["dopuszcza się zamiennie montaż dowolnych drzwi, ale muszą być wyposażone w dwa zamki atestowane i blokadę przeciwwyważeniową","gabloty do przechowywania broni i amunicji posiadają zamknięcia co najmniej klasy 5 wg normy PN-EN 12209","zabezpieczyć drzwi wejściowe do pomieszczenia, w którym przechowywana jest broń, w instalację alarmową"],"a":1,"e":""},{"id":"p359","t":"Przechowywanie i noszenie","q":"Karty ewidencji posiadanej broni i amunicji podmiotu posiadającego broń i amunicję powinny być","o":["ponumerowane i opatrzone na każdej stronie pieczęcią podmiotu posiadającego broń i amunicje","ponumerowane, przeszyte i opatrzone na ostatniej stronie pieczęcią podmiotu posiadającego broń i amunicje","oznaczenie numeryczne opieczętowane lub oznaczone logotypem podmiotu posiadającego broń i amunicje"],"a":1,"e":""},{"id":"p360","t":"Transport publiczny","q":"W środkach transportu publicznego, służących do przewozu pasażerów, broń do celów kolekcjonerskich","o":["może być załadowana bez wprowadzonego naboju do komory nabojowej i przewożona w stanie zabezpieczonym","przewozi się w stanie rozładowanym, bez amunicji w komorze nabojowej i magazynkach nabojowych","przewożona jest w dowolny sposób"],"a":1,"e":""},{"id":"p361","t":"Transport publiczny","q":"Broń i amunicja w czasie przewozu środkami transportu publicznego","o":["powinny być przewożone w sposob wygodny dla właściciela i współpasażerów","powinny byc pilnowane przez posiadacza, nie są jednak wymagane dodatkowe zabezpieczenia","powinny byc zabezpieczone w sposób uniemożliwiający dostęp do nich osób nieupoważnionych"],"a":2,"e":""},{"id":"p362","t":"Transport publiczny","q":"Broń i amunicję w pasażerskich statkach powietrznych przewozi się","o":["w lukach bagażowych lub w miejscu wskazanym przez przewoźnika, jako bagaż rejestrowany, do którego pasażerowie nie maja dostępu","w pasażerskich statkach powietrznych przewożenie broni i amunicji jest zabronione","przy sobie lub bagażu podręcznym"],"a":0,"e":""},{"id":"p363","t":"Transport publiczny","q":"W środkach transportu publicznego amunicję przewozi się w ilości","o":["nie większej niż 100 sztuk, tylko, jeśli osoba przewożąca udaje się na strzelnice","która mieści się do magazynków broni","w ilości uzasadnionej potrzebami osoby przewożącej"],"a":2,"e":""},{"id":"p364","t":"Transport publiczny","q":"W środkach transportu publicznego, służących do przewozu pasażerów, broń co do zasady","o":["może być przewożona z nabojem w komorze, jeżeli jest zabezpieczona","może być przewożona bez żadnych dodatkowych zabezpieczeń","przewozi się w stanie rozładowanym, bez amunicji w komorze nabojowej i magazynkach nabojowych"],"a":2,"e":""},{"id":"p365","t":"Transport publiczny","q":"W środkach transportu publicznego broń do ochrony osobistej lub bezpieczeństwa innych osób oraz mienia","o":["może być załadowana i przygotowana do strzału. Właściciel może ja dodatkowo zabezpieczyć","może być załadowana bez wprowadzonego naboju do komory nabojowej i przewożona w stanie zabezpieczonym","musi być rozładowana, bez naboju w komorze nabojowej lub magazynkach"],"a":1,"e":""},{"id":"p366","t":"Transport publiczny","q":"W środkach transportu publicznego broń przewozi się w stanie","o":["zależy to od posiadacza broni palnej, musi być jednak poza zasięgiem osób postronnych","rozładowanym, bez amunicji w komorze nabojowej i w magazynkach nabojowych","rozładowanym, bez amunicji w komorze nabojowej; amunicja może znajdować się w magazynkach niepodłączonych do broni"],"a":1,"e":""},{"id":"p367","t":"Transport publiczny","q":"W środkach transportu publicznego amunicję przewozi się","o":["w opakowaniach fabrycznych przeznaczonych do sprzedaży detalicznej lub w pudelkach i pojemnikach, w sposób uniemożliwiający uderzenie w spłonkę naboju","w hermetycznych opakowaniach próżniowych lub opakowaniach z zabezpieczeniem spłonki naboju folia bąbelkowa lub trocinami","w magazynkach danego rodzaju broni, do której amunicja jest przewożona"],"a":0,"e":""},{"id":"p368","t":"Regulamin strzelnicy","q":"Rozporządzenie w sprawie wzorcowego regulaminu strzelnic określa wzorcowy regulamin bezpiecznego funkcjonowania strzelnic, z uwzględnieniem","o":["warunków korzystania ze strzelnicy, sposobu obchodzenia się z bronią, zachowania się osób przebywających na strzelnicy oraz przemieszczania się osób i pojazdów po terenie strzelnicy","warunków korzystania ze strzelnicy przez osoby niepełnosprawne","warunków korzystania ze strzelnicy, sposobu obchodzenia się z bronią oraz zachowania się osób przebywających na strzelnicy"],"a":2,"e":""},{"id":"p369","t":"Regulamin strzelnicy","q":"Broń palna na strzelnicy poza stanowiskami strzeleckimi musi być","o":["zabezpieczona i schowana w kaburze","rozładowana, schowana wyłącznie w pokrowcu","rozładowana, zabezpieczona i schowana w kaburze lub kasecie przeznaczonej do przenoszenia broni"],"a":2,"e":""},{"id":"p370","t":"Regulamin strzelnicy","q":"Prowadzący strzelanie to","o":["osoba, która odbyła przeszkolenie w zakresie prowadzenia strzelania oraz udzielania pomocy medycznej organizowane przez uprawnione podmioty","osoba posiadająca uprawnienia do szkolenia w zakresie strzelectwa, posiadająca pozwolenie na broń do celów szkoleniowych","wyznaczona przez właściciela strzelnicy osoba, odpowiadająca za sprawne przeprowadzenie strzelań"],"a":0,"e":""},{"id":"p371","t":"Regulamin strzelnicy","q":"Na strzelnicy pies może przebywać wyłącznie","o":["za zgodą wszystkich obecnych uczestników strzelania","w ściśle wydzielonym miejscu obiektu, przeznaczonym do pobytu zwierząt","na uwięzi pod ścisłym nadzorem opiekuna"],"a":2,"e":""},{"id":"p372","t":"Regulamin strzelnicy","q":"Kiedy można wprowadzać na strzelnicę zwierzęta?","o":["gdy jest przerwa w strzelaniu","gdy opiekun zwierzęcia nie bierze udziału w strzelaniu","tylko w wyjątkowych okolicznościach, na uwięzi i pod ścisłym nadzorem opiekuna"],"a":2,"e":""},{"id":"p373","t":"Regulamin strzelnicy","q":"Na terenie strzelnicy broń z kabury wyjmuje się","o":["na polecenie prowadzącego","po otrzymaniu od amunicyjnego przydzielonej amunicji","po wejściu na linie ognia"],"a":0,"e":""},{"id":"p374","t":"Regulamin strzelnicy","q":"Czy na terenie strzelnicy wolno osobom towarzyszącym osobom korzystającym ze strzelnicy mieć styczność z bronią?","o":["tak, jeśli broń jest rozładowana i ma włożony wskaźnik bezpieczeństwa","tak, pod kontrola sędziego zawodów","nie"],"a":2,"e":""},{"id":"p375","t":"Regulamin strzelnicy","q":"Broń palną na strzelnicy przenosi się","o":["rozładowaną, z otwartą komorą nabojową, bez pasów i pokrowców","rozładowana, zabezpieczona w sposób uniemożliwiający oddanie przypadkowego strzału","załadowana, zabezpieczona i schowana w kaburze, pokrowcach, kasetach przeznaczonych do przenoszenia broni"],"a":0,"e":""},{"id":"p376","t":"Regulamin strzelnicy","q":"Kto na strzelnicy może nie przestrzegać przepisów dotyczących postaw strzeleckich?","o":["osoby niepełnosprawne, dzieci lub strzelcy posiadający zaświadczenie od lekarza o przeciwwskazaniach medycznych w utrzymaniu postaw strzeleckich","prowadzący strzelanie i osoby przez niego upoważnione","osoby niepełnosprawne"],"a":2,"e":""},{"id":"p377","t":"Regulamin strzelnicy","q":"Obowiązkiem prowadzącego strzelanie jest","o":["wyznaczenie osobom towarzyszącym, niebiorącym udziału w strzelaniu, miejsc bezpiecznego pobytu","koordynacja komunikacji miedzy sędziami rożnych konkurencji w trakcie zawodów strzeleckich","czuwać nad prawidłowym przebiegiem szkolenia, identyfikować wady techniczne i poprawić strzelców"],"a":0,"e":""},{"id":"p378","t":"Regulamin strzelnicy","q":"Podczas obsługi broni, jej lufa musi być skierowana","o":["pionowo w ziemie, aby w razie przypadkowego wystrzału pocisk utkwił w gruncie","w powietrze, aby w razie przypadkowego wystrzału nie postrzelić innych korzystających ze strzelnicy","w kierunku kulochwytu, tarcz bądź przedmiotów będących celem na strzelnicy"],"a":2,"e":""},{"id":"p379","t":"Regulamin strzelnicy","q":"Strzelnica to","o":["obiekt przeznaczony do prowadzenia strzelań szkoleniowych, sportowych i rekreacyjnych oraz treningów strzeleckich","miejsce bezpiecznego strzelania, wyposażone w kulochwyt","ograniczony walem ziemnym teren, pozwalający na organizacje zawodów strzeleckich zgodnie z regulaminem PZSS."],"a":0,"e":""},{"id":"p380","t":"Regulamin strzelnicy","q":"Po usłyszeniu na strzelnicy komendy \"STOP\" lub \"PRZERWIJ OGIEŃ\", należy","o":["schować broń do kabury i czekać na komendę prowadzącego","natychmiast przerwać strzelanie i pozostać w postawie gotowości","odłożyć broń na stoli i pozostać w postawie gotowości"],"a":1,"e":""},{"id":"p381","t":"Regulamin strzelnicy","q":"Czy na terenie strzelnicy wolno spożywać alkohol lub używać środki odurzające oraz czy wolno przebywać na strzelnicy osobom będącym pod ich wpływem?","o":["bezwzględnie nie","tak, za zgodą właściciela obiektu","tak, ale tylko za wiedz prowadzącego strzelanie"],"a":0,"e":""},{"id":"p382","t":"Regulamin strzelnicy","q":"Po zakończeniu strzelania","o":["broń rozładowuje się i przedstawia się do kontroli prowadzącemu strzelanie","samemu się broń, a następnie po uzyskaniu zgody od prowadzącego strzelanie, opuszcza się stanowisko strzeleckie z bronią","po sprawdzeniu broni przez prowadzącego strzelanie, broń chowa się do kabury i opuszcza stanowisko strzeleckie"],"a":0,"e":""},{"id":"p383","t":"Regulamin strzelnicy","q":"Na strzelnicę zwierzęta","o":["mogą być wprowadzane tylko w wyjątkowych przypadkach oraz obowiązkowo powinny być trzymane na uwięzi i pod ścisłym nadzorem opiekuna","mogą być wprowadzane, tylko przez swojego przewodnika, jeżeli odbyły tresurę z zakresu posłuszeństwa","nie mogą być wprowadzane"],"a":0,"e":""},{"id":"p384","t":"Regulamin strzelnicy","q":"Dzieci na strzelnicy","o":["mogą przebywać tylko w wyjątkowych okolicznościach","nie mogą przebywać, poza zajęciami organizowanymi przez placówkę edukacyjna","mogą przebywać wyłącznie pod bezpośrednim nadzorem rodziców lub opiekunów"],"a":2,"e":""},{"id":"p385","t":"Regulamin strzelnicy","q":"Wpis do książki rejestru pobytu na strzelnicy każdorazowo musi zawierać","o":["imię nazwisko, oznaczenie prowadzącego strzelanie, adres zameldowania, podpis","imię nazwisko, typ i numer broni, adres zamieszkania, godziny wejscia-wyjscia, podpis","imię nazwisko, numer pozwolenia i nazwę organu wydającego lub adres zamieszkania, podpis"],"a":2,"e":""},{"id":"p386","t":"Regulamin strzelnicy","q":"Z regulaminem strzelnicy należy zapoznać się","o":["tylko, gdy zażąda tego prowadzący strzelanie","zaraz po pierwszym wejściu na strzelnice","przed załadowaniem broni palnej"],"a":1,"e":""},{"id":"p387","t":"Regulamin strzelnicy","q":"Strzelanie rozpoczyna się na komendę","o":["prowadzącego strzelanie","prowadzącego strzelanie, chyba ze chwilowo wyznaczy do tego inna osobę","prowadzącego strzelanie, lub jeśli jest on nieobecny- strzelca o największym doświadczeniu z obsługa broni palnej"],"a":0,"e":""},{"id":"p388","t":"Regulamin strzelnicy","q":"Czy na strzelnicy wolno używać broni innych osób korzystających ze strzelnicy?","o":["tak, jeśli zgodę wyrazi prowadzący strzelanie","tak, o ile posiada się pozwolenie na dany rodzaj broni","tak, ale tylko za zgodą użytkownika broni"],"a":2,"e":""},{"id":"p389","t":"Regulamin strzelnicy","q":"Czy na strzelnicy wolno osobom towarzyszącym osobom korzystającym ze strzelnicy, wchodzić na stanowiska strzeleckie?","o":["tak","wolno, ale tylko za zgodą osoby korzystającej ze strzelnicy","nie"],"a":2,"e":""},{"id":"p390","t":"Regulamin strzelnicy","q":"Na terenie strzelnicy można prowadzić trening bezstrzałowy","o":["w miejscu do tego oznaczonym lub wyznaczonym przez prowadzącego","na linii ognia","w dowolnym miejscu"],"a":0,"e":""},{"id":"p391","t":"Regulamin strzelnicy","q":"Osobę naruszającą regulamin strzelnicy","o":["usuwa się ze strzelnicy","poucza się, nakazując ponownie zapoznać się z zapisami regulaminu","usuwa się ze strzelnicy, zatrzymując broń i amunicje do czasu przyjazdu policji"],"a":0,"e":""},{"id":"p392","t":"Regulamin strzelnicy","q":"Podczas zajęć strzeleckich, strzelający bezzwłocznie przerywa strzelanie po usłyszeniu następującej komendy wydanej przez prowadzącego strzelanie lub inną osobę","o":["NIE STRZELAC","STOP","ZAKONCZYC STRZELANIE"],"a":1,"e":""},{"id":"p393","t":"Regulamin strzelnicy","q":"Na strzelnicy zabrania się","o":["ładowania, rozładowania i celowania w miejscach wyznaczonych przez prowadzącego strzelanie","poruszania na wózkach inwalidzkich","używania broni innych osób korzystających ze strzelnicy, bez zgody jej użytkownika"],"a":2,"e":""},{"id":"p394","t":"Regulamin strzelnicy","q":"W przypadku jakichkolwiek wątpliwości na terenie strzelnicy, należy pytać","o":["prowadzącego strzelanie","na strzelnicy nie wolno nikogo o nic pytać, aby nie przeszkadzać","kolegę na sąsiednim stanowisku"],"a":0,"e":""},{"id":"p395","t":"Regulamin strzelnicy","q":"Za bezpieczeństwo i porządek na strzelnicy odpowiada","o":["właściciel strzelnicy","organizator strzelania","prowadzący strzelanie"],"a":2,"e":""},{"id":"p396","t":"Regulamin strzelnicy","q":"Po ukończeniu strzelania, należy","o":["wyjąć magazynek z broni i zejść z linii ognia","pozostać na linii ognia z bronią w pozycji gotowości i czekać na komendę prowadzącego","schować broń do kabury i pozostać na linii ognia"],"a":1,"e":""},{"id":"p397","t":"Regulamin strzelnicy","q":"Każdy korzystający ze strzelnicy ma obowiązek wpisania się do \"Książki rejestru pobytu na strzelnicy\", którą prowadzi","o":["kierownik strzelnicy","prowadzący strzelanie","kierownik jednostki"],"a":1,"e":""},{"id":"p398","t":"Regulamin strzelnicy","q":"Jeżeli podczas strzelania zauważy się jakiekolwiek niebezpieczeństwo na terenie strzelnicy, należy","o":["podejść do prowadzącego i zwrócić mu uwagę","przerwać ogień i czekać, aż prowadzący zauważy niebezpieczeństwo","przestać strzelać i wydać głośno komendę \"STOP\" lub \"PRZERWIJ OGIEŃ\""],"a":2,"e":""},{"id":"p399","t":"Regulamin strzelnicy","q":"Na strzelnicy stanowiska strzeleckie oraz miejsca bezpiecznego pobytu wyznacza","o":["prowadzący strzelanie","właściciel strzelnicy","organizator strzelania"],"a":0,"e":""},{"id":"p400","t":"Regulamin strzelnicy","q":"Kiedy można wejść przed stanowisko strzeleckie?","o":["gdy zgodę wyrazi prowadzący strzelanie","gdy nikt nie strzela","gdy broń jest rozładowana, nawet bez zgody prowadzącego strzelanie"],"a":0,"e":""},{"id":"p401","t":"Regulamin strzelnicy","q":"Komendę \"STOP\" może wydać","o":["tylko osoba uczestnicząca w strzelaniu","każda osoba, która uzna, iż istnieje zagrożenie na strzelnicy","tylko prowadzący strzelanie"],"a":1,"e":""},{"id":"p402","t":"Regulamin strzelnicy","q":"W jaki sposób należy złożyć oświadczenie potwierdzające zapoznanie się z regulaminem strzelnicy?","o":["pisemnie, na wniosku o przedłużenie licencji zawodniczej","pisemnie poprzez wpis do książki rejestru pobytu na strzelnicy","nie ma takiego obowiązku"],"a":1,"e":""},{"id":"p403","t":"Regulamin strzelnicy","q":"Zakończenie strzelania na strzelnicy zgłasza się","o":["prowadzącemu strzelanie","innym osobom korzystającym z przyległych osi strzeleckich","właścicielowi strzelnicy"],"a":0,"e":""},{"id":"p404","t":"Budowa broni","q":"Lufa gwintowana oznacza lufę","o":["pozwalająca na montaż urządzeń wylotowych jak tłumik płomienia, kompensator czy zatyczka","posiadająca wewnętrzne bruzdy, które w trakcie wystrzału nadają pociskowi ruch obrotowy","mocowana do łoza broni poprzez wkręcenie mimośrodowe"],"a":1,"e":""},{"id":"p405","t":"Budowa broni","q":"Pazur wyciągu służy do","o":["automatycznego ściągania nabojów z magazynka broni samopowtarzalnej","ekstrakcji naboju lub łuski z komory nabojowej","szybkiego usuwania zaciec typu fajka lub squib"],"a":1,"e":""}];
const OLDMAP = {"abc1": "p235", "abc2": "p233", "abc3": "p215", "abc4": "p206", "abc5": "p234", "abc6": "p305", "abc7": "p271", "abc8": "p313", "abc9": "p330", "abc10": "p333", "abc11": "p276", "abc12": "p292", "abc13": "p336", "abc14": "p257", "abc15": "p338", "abc16": "p273", "abc17": "p311", "abc18": "p318", "abc19": "p340", "abc20": "p325", "abc21": "p256", "abc22": "p285", "abc23": "p293", "abc24": "p319", "abc25": "p258", "abc26": "p316", "abc27": "p297", "abc28": "p339", "abc29": "p312", "abc30": "p322", "abc31": "p253", "abc32": "p175", "abc33": "p198", "abc34": "p171", "abc35": "p149", "abc36": "p142", "abc37": "p192", "abc38": "p145", "abc39": "p144", "abc40": "p153"};

// Stabilne identyfikatory: nowe pytania zawsze dopisujemy na końcu tablicy.
Q.forEach(q => { q.type = q.type || "abc"; });

const OLD_KEY = "quizPatentWrong_v1", KEY = "quizPatentStats_v2", NEED = 2;
const L = ["A","B","C","D"];
let stats = {};
try {
  const s = localStorage.getItem(KEY);
  if (s) {
    stats = JSON.parse(s) || {};
    // przeniesienie statystyk z pierwszej wersji quizu (40 pytań)
    Object.keys(stats).forEach(k => { if (OLDMAP[k]) { if (!stats[OLDMAP[k]]) stats[OLDMAP[k]] = stats[k]; delete stats[k]; } });
  } else {
    const old = localStorage.getItem(OLD_KEY);
    if (old) JSON.parse(old).forEach(k => { const id = OLDMAP["abc"+(k+1)]; if (id) stats[id] = {ok:0,bad:1,streak:0}; });
  }
} catch(e) { stats = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(stats)); } catch(e) {} }
const st = id => stats[id] || (stats[id] = {ok:0,bad:0,streak:0});
const isWeak = q => { const s = stats[q.id]; return !!s && s.bad > 0 && s.streak < NEED; };

let mode = "all", topic = "", order = [], i = 0, good = 0, answered = false;
const $ = id => document.getElementById(id);
function shuffle(a){ for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];} return a; }
const esc = t => String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function fillTopics(){
  const sel = $("topic"), topics = [...new Set(Q.map(q=>q.t))];
  sel.innerHTML = '<option value="">Wszystkie działy</option>' + topics.map(t=>`<option>${esc(t)}</option>`).join("");
  sel.onchange = () => { topic = sel.value; start(mode); };
}
function pool(m){
  return Q.filter(q => (!topic || q.t === topic) && (m !== "wrong" || isWeak(q)));
}
function start(m){
  mode = m; order = shuffle(pool(m)); i = 0; good = 0;
  $("mAll").setAttribute("aria-pressed", m==="all");
  $("mWrong").setAttribute("aria-pressed", m==="wrong");
  render();
}
function updateMeta(){
  const weak = Q.filter(isWeak).length;
  $("wc").textContent = weak;
  $("mWrong").disabled = weak === 0 && mode !== "wrong";
  const n = order.length;
  $("pos").textContent = n ? `Pytanie ${Math.min(i+1,n)} z ${n}` : "";
  $("score").textContent = n ? `Dobrze: ${good}` : "";
  $("prog").style.width = n ? (i/n*100)+"%" : "0";
}
function statLine(q){
  const s = stats[q.id];
  if (!s || (!s.ok && !s.bad)) return "Pierwsze podejście";
  const left = isWeak(q) ? ` · do zaliczenia: ${NEED - s.streak} dobre z rzędu` : "";
  return `Dobrze ${s.ok} · źle ${s.bad}${left}`;
}
function render(){
  answered = false;
  $("hit").setAttribute("opacity","0");
  updateMeta();
  const box = $("stage");
  if (!order.length){
    box.innerHTML = `<div class="q done"><p class="big">0</p><p>${mode==="wrong" ? "Nic do poprawki w tym zakresie." : "Brak pytań w tym dziale."}</p><button class="next" id="again">Wszystkie pytania</button></div>`;
    $("again").onclick = () => { topic=""; $("topic").value=""; start("all"); };
    return;
  }
  if (i >= order.length){
    $("prog").style.width = "100%";
    const weak = Q.filter(isWeak).length;
    box.innerHTML = `<div class="q done"><p class="big">${good}/${order.length}</p><p>${weak ? `Do poprawki: ${weak}.` : "Wszystko zaliczone."}</p>
      <button class="next" id="again">Jeszcze raz</button>
      ${weak ? '<button class="next" id="fix" style="margin-top:10px">Tylko do poprawki</button>' : ''}</div>`;
    $("again").onclick = () => start(mode === "wrong" && weak ? "wrong" : "all");
    if (weak) $("fix").onclick = () => start("wrong");
    return;
  }
  const q = order[i];
  const head = `<div class="qhead"><p class="topic">${esc(q.t)}</p><p class="qstat">${statLine(q)}</p></div><p class="qtext">${esc(q.q)}</p>`;
  if (q.type === "card"){
    box.innerHTML = `<div class="q">${head}<button class="next" id="show">Pokaż odpowiedź</button><div id="after"></div></div>`;
    $("show").onclick = () => {
      $("show").remove();
      $("after").innerHTML = `<div class="expl"><strong>Odpowiedź</strong>${esc(q.ans)}${q.src ? `<span class="src">${esc(q.src)}</span>` : ""}</div>
        <div class="grade"><button class="gbad" id="gNo">Nie umiałem</button><button class="gok" id="gYes">Umiałem</button></div>`;
      $("gYes").onclick = () => grade(q, true, true);
      $("gNo").onclick = () => grade(q, false, true);
    };
    return;
  }
  box.innerHTML = `<div class="q">${head}
    ${q.o.map((t,j)=>`<button class="opt" data-j="${j}"><b>${L[j]}</b><span>${esc(t)}</span></button>`).join("")}
    <div id="after"></div></div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(q, +b.dataset.j));
}
function grade(q, ok, isCard){
  const s = st(q.id);
  if (ok){ good++; s.ok++; s.streak++; $("hit").setAttribute("opacity","1"); }
  else { s.bad++; s.streak = 0; }
  save();
  if (isCard){ i++; render(); }
}
function pick(q, j){
  if (answered) return; answered = true;
  const ok = j === q.a;
  document.querySelectorAll(".opt").forEach((b,n) => {
    b.disabled = true;
    if (n === q.a) b.classList.add("ok"); else if (n === j) b.classList.add("bad");
  });
  grade(q, ok, false);
  $("after").innerHTML = `<div class="expl"><strong>${ok ? "Dobrze." : "Poprawna odpowiedź: " + L[q.a] + "."}</strong>${q.e ? esc(q.e) : ""}</div>
    <button class="next" id="nx">${i+1 < order.length ? "Następne pytanie" : "Zobacz wynik"}</button>`;
  $("nx").onclick = () => { i++; render(); };
  $("nx").focus();
  updateMeta();
}
$("mAll").onclick = () => start("all");
$("mWrong").onclick = () => start("wrong");
$("reset").onclick = () => { if (confirm("Wyczyścić całą historię odpowiedzi?")) { stats = {}; save(); start("all"); } };
const pl = n => n === 1 ? "pytanie" : (n%10>=2 && n%10<=4 && (n%100<12 || n%100>14)) ? "pytania" : "pytań";
$("export").onclick = async () => {
  const weak = Q.filter(isWeak);
  const box = $("exportBox"), msg = $("exportMsg"), ta = $("exportText");
  box.hidden = false;
  if (!weak.length){ msg.textContent = "Nie masz jeszcze pytań do poprawki. Przerób część bazy i wróć tutaj."; ta.value = ""; return; }
  const text = "Trudne pytania (" + weak.length + "): " + weak.map(q => q.id).join(", ") + "\n\n" +
    weak.map(q => q.id + " — " + q.q).join("\n");
  ta.value = text;
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; } catch(e) {}
  msg.textContent = copied ? `Skopiowano ${weak.length} ${pl(weak.length)}. Wklej to w rozmowie z Claude.` : `Zaznacz tekst poniżej i skopiuj go do rozmowy z Claude (${weak.length} ${pl(weak.length)}).`;
  if (!copied){ ta.focus(); ta.select(); }
};
fillTopics();
start("all");
</script>
</body>
